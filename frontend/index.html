<!doctype html>
<html lang="tr" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment &amp; Order Ops</title>
    <script>
      try {
        var SCHEMES = {
          dark: 'dark',
          midnight: 'dark',
          grape: 'dark',
          ember: 'dark',
          forest: 'dark',
          light: 'light',
          sage: 'light',
          sepia: 'light',
          blush: 'light',
          lavender: 'light',
        };
        var persisted = JSON.parse(localStorage.getItem('boyner-ops-ui') || '{}');
        var stored = persisted && persisted.state && persisted.state.theme;
        var theme = Object.prototype.hasOwnProperty.call(SCHEMES, stored) ? stored : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = SCHEMES[theme];
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
