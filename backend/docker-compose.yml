name: payment-order-ops

services:
  db:
    image: postgres:17-alpine
    container_name: payment-order-ops-db
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops_local_pw
      POSTGRES_DB: payment_order_ops
    ports:
      - "5544:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d payment_order_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
